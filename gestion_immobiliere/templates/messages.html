{% extends 'base.html' %}

{% block content %}
<!-- Top App Bar -->
<div
  class="flex items-center bg-white dark:bg-background-dark p-3 sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800">
  <div class="flex w-12 items-center justify-start">
    <a href="javascript:history.back()"
      class="flex items-center justify-center rounded-full h-10 w-10 text-gray-800 dark:text-white">
      <span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
    </a>
  </div>
  <div class="flex-1 flex flex-col items-center justify-center">
    <select id="contact-select"
      class="bg-transparent border-none text-gray-900 dark:text-white text-lg font-bold text-center focus:ring-0 cursor-pointer p-0 m-0">
      <option value="" disabled selected>Choisir un contact</option>
    </select>
    <p id="contact-role" class="text-[10px] text-gray-500 dark:text-gray-400 font-medium uppercase tracking-wider">-</p>
  </div>
  <div class="flex w-12 items-center justify-end">
    <button class="flex items-center justify-center rounded-full h-10 w-10 text-gray-800 dark:text-white">
      <span class="material-symbols-outlined text-2xl">more_vert</span>
    </button>
  </div>
</div>
<!-- Chat Messages -->
<div id="chat-messages" class="flex-1 overflow-y-auto px-4 pt-4 pb-2 space-y-4">
  <p class="text-sm text-center text-gray-500 mt-4">Chargement des messages...</p>
</div>
<!-- Composer -->
<div
  class="flex items-center px-3 py-3 gap-3 bg-white dark:bg-background-dark sticky bottom-0 border-t border-gray-200 dark:border-gray-800">
  <button class="flex items-center justify-center h-10 w-10 shrink-0 text-primary">
    <span class="material-symbols-outlined text-2xl">add_circle</span>
  </button>
  <label class="flex flex-col min-w-40 flex-1">
    <div class="flex w-full flex-1 items-stretch rounded-full h-10">
      <input id="message-input"
        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-full text-gray-900 dark:text-white focus:outline-0 focus:ring-0 border-none bg-background-light dark:bg-gray-800 focus:border-none h-full placeholder:text-gray-500 dark:placeholder:text-gray-400 px-4 text-base font-normal leading-normal"
        placeholder="Écrivez votre message..." value="" />
    </div>
  </label>
  <button id="send-message-btn" class="flex items-center justify-center h-10 w-10 shrink-0 text-primary">
    <span class="material-symbols-outlined text-2xl">send</span>
  </button>
</div>
{% endblock %}
