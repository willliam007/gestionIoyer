<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{% block title %}ImmoGestion{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body class="font-display bg-background-light dark:bg-background-dark">
    <div
        class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden text-[#111418] dark:text-gray-100">
        {% block content %}
        {% endblock %}
    </div>
    {% block scripts %}
    <script src="/static/js/sw-register.js"></script>
    <script src="/static/js/app.js"></script>
    {% endblock %}

    <!-- Bottom Navigation Bar (Hidden by default, shown by JS) -->
    <div id="bottom-nav"
        class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] w-[calc(100%-2rem)] max-w-[400px] rounded-[2rem] border bg-white/70 dark:bg-[#101922]/70 backdrop-blur-2xl border-white/40 dark:border-white/10 shadow-[0_8px_30px_rgb(0,0,0,0.12)]">
        <div class="flex h-[72px] w-full items-center justify-around px-2">
            <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400" href="#"
                id="nav-home">
                <span class="material-symbols-outlined">dashboard</span>
                <span class="text-xs font-semibold text-center leading-none">Accueil</span>
            </a>

            <a id="nav-biens"
                class="hidden flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400"
                href="/ajouter-propriete">
                <span class="material-symbols-outlined">holiday_village</span>
                <span class="text-xs font-medium text-center leading-none">Biens</span>
            </a>
            <a id="nav-locataires"
                class="hidden flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400"
                href="/contrat">
                <span class="material-symbols-outlined">groups</span>
                <span class="text-xs font-medium text-center leading-none">Locataires</span>
            </a>

            <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400"
                href="/paiements" id="nav-payments">
                <span class="material-symbols-outlined">payments</span>
                <span class="text-xs font-medium text-center leading-none">Paiements</span>
            </a>

            <a class="flex flex-col items-center justify-center gap-1 text-gray-500 dark:text-gray-400"
                href="/notifications" id="nav-notifications">
                <span class="material-symbols-outlined">notifications</span>
                <span class="text-xs font-medium text-center leading-none">Alertes</span>
            </a>

            
        </div>
    </div>

    <!-- Socket.IO client (WebSockets temps réel) -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
    <script>
        (function() {
            const _userId = localStorage.getItem('user_id');
            if (!_userId) return;
            const socket = io();
            socket.on('connect', function() { socket.emit('join', { user_id: parseInt(_userId) }); });
                        // Real-time notification: update badge pulse
            socket.on('new_notification', function(notif) {
                const navNotif = document.getElementById('nav-notifications');
                if (navNotif) {
                    navNotif.classList.add('text-red-500'); // Visual alert
                    // Optional: generic toast or alert
                }
            });
            socket.on('new_message', function(msg) {
                if (window.location.pathname === '/messages' && typeof window._loadCurrentMessages === 'function') {
                    window._loadCurrentMessages();
                }
                const chatNav = document.getElementById('nav-messages');
                if (chatNav && window.location.pathname !== '/messages') chatNav.classList.add('text-primary');
            });
        })();
    </script>
    <!-- Agentation Integration -->
    <div id="agentation-root"></div>
    <script type="module">
        import React from 'https://esm.sh/react@18';
        import { createRoot } from 'https://esm.sh/react-dom@18/client';
        import { Agentation } from 'https://esm.sh/agentation?deps=react@18';

        const container = document.getElementById('agentation-root');
        if (container) {
            const root = createRoot(container);
            root.render(React.createElement(Agentation));
        }
    </script>
</body>
</html>
