{% extends 'base.html' %}

{% block content %}
<div class="flex items-center p-4">
    <a href="/"
        class="flex size-10 items-center justify-center rounded-full bg-white dark:bg-gray-800 shadow-sm hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
        <span class="material-symbols-outlined text-[#111418] dark:text-white">arrow_back_ios_new</span>
    </a>
</div>
<div class="flex flex-col flex-1 px-6 pt-8 pb-10">
    <div class="mb-10 text-center">
        <div class="inline-flex items-center justify-center p-4 bg-primary/10 rounded-2xl mb-6">
            <span class="material-symbols-outlined text-primary text-4xl">real_estate_agent</span>
        </div>
        <h1 class="text-[#111418] dark:text-white text-3xl font-extrabold tracking-tight mb-2">Bon retour !</h1>
        <p class="text-[#617589] dark:text-gray-400 text-base">Connectez-vous pour gérer vos loyers et paiements</p>
    </div>
    <form id="login-form" class="flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
            <label class="text-[#111418] dark:text-white text-sm font-bold ml-1" for="email">Adresse e-mail</label>
            <div class="relative">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">mail</span>
                <input id="email"
                    class="w-full h-14 pl-12 pr-4 rounded-xl border-none bg-white dark:bg-gray-800 text-[#111418] dark:text-white placeholder-gray-400 shadow-sm focus:ring-2 focus:ring-primary transition-all"
                    placeholder="exemple@email.com" type="email" required />
            </div>
        </div>
        <div class="flex flex-col gap-1.5">
            <div class="flex justify-between items-center ml-1">
                <label class="text-[#111418] dark:text-white text-sm font-bold" for="password">Mot de passe</label>
                <a class="text-primary text-xs font-bold hover:underline" href="#">Mot de passe oublié ?</a>
            </div>
            <div class="relative">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">lock</span>
                <input id="password"
                    class="w-full h-14 pl-12 pr-12 rounded-xl border-none bg-white dark:bg-gray-800 text-[#111418] dark:text-white placeholder-gray-400 shadow-sm focus:ring-2 focus:ring-primary transition-all"
                    placeholder="••••••••" type="password" required />
                <button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400" type="button">
                    <span class="material-symbols-outlined text-xl">visibility</span>
                </button>
            </div>
        </div>
        <div class="flex items-center gap-2 mt-1 ml-1">
            <input class="size-5 rounded border-gray-300 dark:border-gray-700 text-primary focus:ring-primary"
                id="remember" type="checkbox" />
            <label class="text-sm text-[#617589] dark:text-gray-400" for="remember">Se souvenir de moi</label>
        </div>
        <button
            class="mt-4 flex h-14 w-full items-center justify-center rounded-xl bg-primary text-white text-base font-bold shadow-lg shadow-primary/30 active:scale-[0.98] transition-all"
            type="submit">
            Se connecter
        </button>
        <p id="login-error" class="hidden text-red-500 text-sm mt-2 text-center"></p>
    </form>
    <div class="relative my-10">
        <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200 dark:border-gray-800"></div>
        </div>
        <div class="relative flex justify-center text-sm">
            <span class="bg-background-light dark:bg-background-dark px-4 text-[#617589] dark:text-gray-400">Ou
                continuer avec</span>
        </div>
    </div>
    <div class="flex gap-4">
        <button
            class="flex-1 flex h-14 items-center justify-center rounded-xl bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 shadow-sm">
            <svg class="w-6 h-6" viewBox="0 0 24 24">
                <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4"></path>
                <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853"></path>
                <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    fill="#FBBC05"></path>
                <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335"></path>
            </svg>
        </button>
        <button class="flex-1 flex h-14 items-center justify-center rounded-xl bg-[#111418] text-white shadow-sm">
            <span class="material-symbols-outlined text-2xl">ios</span>
        </button>
    </div>
    <div class="mt-auto pt-8 flex justify-center gap-1.5">
        <p class="text-[#617589] dark:text-gray-400">Nouveau ici ?</p>
        <a class="text-primary font-bold hover:underline" href="/register">Créer un compte</a>
    </div>
</div>
{% endblock %}
