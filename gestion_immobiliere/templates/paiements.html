{% extends 'base.html' %}

{% block content %}
<!-- Top App Bar -->
<div
    class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800">
    <a href="javascript:history.back()" class="text-[#111418] dark:text-white flex size-12 shrink-0 items-center">
        <span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
    </a>
    <h2 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">
        Historique des Paiements</h2>
    <div class="flex items-center justify-end gap-2 pr-2">
        <a id="export-csv-btn"
            class="hidden flex h-10 w-10 items-center justify-center rounded-full bg-green-100 text-green-600 hover:bg-green-200"
            title="Exporter CSV">
            <span class="material-symbols-outlined">download</span>
        </a>
        <!-- Button to show for tenants to declare payment -->
        <button id="show-declare-btn"
            class="hidden flex h-10 w-10 items-center justify-center rounded-full bg-primary/10 text-primary">
            <span class="material-symbols-outlined">add</span>
        </button>
        <!-- Generic upload button (interactive simulation) -->
        <button id="upload-receipt-btn"
            class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-[#111418] dark:text-white">
            <span class="material-symbols-outlined">upload</span>
        </button>
    </div>
</div>
<input type="file" id="hidden-file-input" class="hidden" accept="image/*,.pdf">

<!-- Declaration Form (Hidden by default) -->
<div id="declaration-form-container"
    class="hidden p-4 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
    <h3 class="font-bold text-lg mb-4 dark:text-white">Déclarer un paiement</h3>
    <form id="payment-declaration-form" class="space-y-4">
        <label class="block">
            <span class="text-sm font-medium dark:text-gray-300">Montant (€)</span>
            <input type="number" id="pay-amount" step="0.01" required
                class="mt-1 block w-full rounded-xl border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-primary focus:ring-primary h-12 px-4 shadow-none">
        </label>
        <label class="block">
            <span class="text-sm font-medium dark:text-gray-300">Référence / Description</span>
            <input type="text" id="pay-desc" placeholder="ex: Loyer Octobre"
                class="mt-1 block w-full rounded-xl border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-primary focus:ring-primary h-12 px-4 shadow-none">
        </label>
        <div class="flex gap-3">
            <button type="button" id="cancel-declare-btn"
                class="flex-1 py-3 text-sm font-bold text-gray-500 bg-gray-100 rounded-xl">Annuler</button>
            <button type="submit"
                class="flex-1 py-3 text-sm font-bold text-white bg-primary rounded-xl">Envoyer</button>
        </div>
    </form>
</div>

<!-- Filter Chips -->
<div class="flex gap-3 p-4 overflow-x-auto bg-background-light dark:bg-background-dark sticky top-[74px] z-10">
    <button class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-primary/20 pl-4 pr-2">
        <p class="text-primary text-sm font-medium leading-normal">Période</p>
        <span class="material-symbols-outlined text-primary text-xl">expand_more</span>
    </button>
    <button
        class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-gray-200 dark:bg-gray-700 pl-4 pr-2">
        <p class="text-[#111418] dark:text-white text-sm font-medium leading-normal">Propriété</p>
        <span class="material-symbols-outlined text-[#111418] dark:text-white text-xl">expand_more</span>
    </button>
    <button
        class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-gray-200 dark:bg-gray-700 pl-4 pr-2">
        <p class="text-[#111418] dark:text-white text-sm font-medium leading-normal">Statut</p>
        <span class="material-symbols-outlined text-[#111418] dark:text-white text-xl">expand_more</span>
    </button>
</div>

<!-- Payment List -->
<div class="flex flex-col px-4 space-y-4 pb-24">
    <div id="payments-list" class="flex flex-col gap-3">
        <p class="text-sm text-center text-gray-500 mt-4">Chargement des paiements...</p>
    </div>
</div>
{% endblock %}
