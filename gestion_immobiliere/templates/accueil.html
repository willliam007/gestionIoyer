{% extends 'base.html' %}

{% block content %}
<div class="flex-grow flex flex-col justify-between p-6">
    <!-- Header -->
    <header class="flex justify-start items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
                <span class="material-symbols-outlined text-white text-xl">
                    home
                </span>
            </div>
            <span class="text-xl font-bold text-gray-800 dark:text-white">ImmoGestion</span>
        </div>
    </header>
    <!-- Hero Section -->
    <main class="flex flex-col items-center text-center -mt-12">
        <div class="w-full flex justify-center mb-8">
            <div class="w-48 h-48 bg-primary/10 rounded-full flex items-center justify-center"
                data-alt="Stylized illustration of a house inside a circle">
                <span class="material-symbols-outlined text-primary text-8xl">
                    real_estate_agent
                </span>
            </div>
        </div>
        <h1 class="text-[#111418] dark:text-white tracking-tight text-[32px] font-bold leading-tight max-w-sm">Gérez vos
            locations et paiements en toute simplicité.</h1>
    </main>
    <!-- Action Section -->
    <div class="flex flex-col gap-4">
        <p class="text-[#111418] dark:text-gray-300 text-base font-normal leading-normal text-center" id="auth-title">
            Vous êtes ?   </p>

        <div class="flex">
            <div class="flex h-12 flex-1 items-center justify-center rounded-lg bg-gray-200 dark:bg-gray-800 p-1">
                <label
                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-gray-700 has-[:checked]:shadow-sm has-[:checked]:text-primary text-gray-600 dark:text-gray-400 text-sm font-medium leading-normal transition-all duration-200">
                    <span class="truncate">Propriétaire</span>
                    <input checked="" class="invisible w-0" name="user-role" type="radio"
                        value="Je suis Propriétaire" />
                </label>
                <label
                    class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-md px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-gray-700 has-[:checked]:shadow-sm has-[:checked]:text-primary text-gray-600 dark:text-gray-400 text-sm font-medium leading-normal transition-all duration-200">
                    <span class="truncate">Locataire</span>
                    <input class="invisible w-0" name="user-role" type="radio" value="Je suis Locataire" />
                </label>
            </div>
        </div>

        <div class="flex mt-2 justify-center">
            <a href="/register"
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center  justify-center overflow-hidden rounded-lg h-14 px-5 flex-1 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/30">
                <span class="truncate">Créer un compte</span>
            </a>
        </div>
        <p class="text-sm text-center text-gray-600 dark:text-gray-400 mt-2">
            <span>Déjà un compte ? </span>
            <a href="/login" class="font-bold text-primary cursor-pointer">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
