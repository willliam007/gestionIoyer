{% extends 'base.html' %}

{% block content %}
<!-- Top App Bar -->
<header
    class="sticky top-0 z-10 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-black p-4 pb-3">
    <a href="/dashboard-proprietaire" aria-label="Retour"
        class="text-[#111418] dark:text-white flex h-10 w-10 shrink-0 items-center justify-center rounded-full">
        <span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
    </a>
    <h1 class="text-lg font-bold text-[#111418] dark:text-white flex-1 text-center leading-tight tracking-[-0.015em]">
        Mes Propriétés</h1>
    <button id="toggle-add-form-btn"
        class="text-primary flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10">
        <span class="material-symbols-outlined text-2xl" id="toggle-icon">add</span>
    </button>
</header>

<main class="flex-1 pb-20">
    <!-- Modal Ajout de Bien -->
    <div id="property-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="close-property-modal-overlay"></div>
        <div
            class="relative w-full max-w-lg bg-white dark:bg-gray-900 rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200">
            <div class="flex items-center justify-between p-6 border-b border-gray-100 dark:border-gray-800">
                <h2 class="text-xl font-bold text-slate-800 dark:text-white">Nouvelle Propriété</h2>
                <button id="close-property-modal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <form id="add-property-form" class="p-6 space-y-4">
                <div class="space-y-4 max-h-[60vh] overflow-y-auto px-1">
                    <div class="flex flex-col">
                        <label class="text-xs font-bold text-gray-500 uppercase mb-1 ml-1" for="street">Adresse</label>
                        <input
                            class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 h-12 px-4 text-sm"
                            id="street" placeholder="Ex: 123 Rue de Paris" type="text" required />
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col">
                            <label class="text-xs font-bold text-gray-500 uppercase mb-1 ml-1"
                                for="postal-code">CP</label>
                            <input
                                class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 h-12 px-4 text-sm"
                                id="postal-code" placeholder="75001" type="text" required />
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs font-bold text-gray-500 uppercase mb-1 ml-1" for="city">Ville</label>
                            <input
                                class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 h-12 px-4 text-sm"
                                id="city" placeholder="Paris" type="text" required />
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-4">
                        <div class="flex flex-col">
                            <label class="text-xs font-bold text-gray-500 uppercase mb-1 ml-1" for="prix">Loyer
                                (fcfa)</label>
                            <input
                                class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 h-12 px-4 text-sm"
                                id="prix" type="number" required />
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs font-bold text-gray-500 uppercase mb-1 ml-1"
                                for="superficie">m²</label>
                            <input
                                class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 h-12 px-4 text-sm"
                                id="superficie" type="number" required />
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs font-bold text-gray-500 uppercase mb-1 ml-1"
                                for="pieces">Pièces</label>
                            <input
                                class="w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 h-12 px-4 text-sm"
                                id="pieces" type="number" required />
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <p id="property-error" class="hidden text-sm text-red-500 bg-red-50 p-3 rounded-xl mb-4"></p>
                    <p id="property-success" class="hidden text-sm text-green-500 bg-green-50 p-3 rounded-xl mb-4"></p>
                    <button type="submit"
                        class="w-full h-12 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/30 transition-all active:scale-[0.98]">
                        Enregistrer la propriété
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Liste des Biens -->
    <div class="p-4">
        <div class="flex items-center justify-between pb-4">
            <h2 class="text-[#111418] dark:text-white text-xl font-bold leading-tight">Biens Enregistrés</h2>
            <span class="text-xs text-gray-500 font-medium" id="prop-count">0 bien(s)</span>
        </div>
        <div id="properties-list" class="flex flex-col gap-3">
            <p class="text-sm text-gray-500 italic">Chargement des biens...</p>
        </div>
    </div>
</main>
{% endblock %}
