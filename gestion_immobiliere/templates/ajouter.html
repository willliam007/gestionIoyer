{% extends 'base.html' %}

{% block content %}
<!-- Top App Bar -->
<header
    class="sticky top-0 z-10 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-black p-4 pb-3">
    <a href="/dashboard-proprietaire" aria-label="Retour"
        class="text-[#111418] dark:text-white flex h-10 w-10 shrink-0 items-center justify-center rounded-full">
        <span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
    </a>
    <h1 class="text-lg font-bold text-[#111418] dark:text-white flex-1 text-center leading-tight tracking-[-0.015em]">
        Mes Propriétés</h1>
    <button id="toggle-add-form-btn"
        class="text-primary flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10">
        <span class="material-symbols-outlined text-2xl" id="toggle-icon">add</span>
    </button>
</header>

<main class="flex-1 pb-20">
    <!-- Section Ajout (Cachée par défaut) -->
    <div id="add-property-form-container" class="hidden animate-in slide-in-from-top duration-300">
        <div class="px-4 pt-5 pb-2">
            <h2 class="text-[#111418] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em]">Ajouter une
                Propriété</h2>
        </div>

        <div class="flex flex-col gap-2 p-4">
            <!-- Section 1: Adresse -->
            <div class="flex flex-col">
                <label class="text-[#111418] dark:text-white text-sm font-medium leading-normal pb-2" for="street">Rue
                    et numéro</label>
                <input
                    class="form-input flex w-full min-w-0 flex-1 rounded-lg text-[#111418] dark:text-white border border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark h-12 p-4 text-base"
                    id="street" placeholder="Ex: 123 Rue de Paris" type="text" />
            </div>

            <div class="flex flex-wrap items-end gap-4 pt-3">
                <div class="flex flex-col min-w-24 flex-1">
                    <label class="text-[#111418] dark:text-white text-sm font-medium pb-2" for="postal-code">Code
                        postal</label>
                    <input
                        class="form-input w-full rounded-lg text-[#111418] dark:text-white border border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark h-12 p-4"
                        id="postal-code" placeholder="75001" type="text" />
                </div>
                <div class="flex flex-col min-w-40 flex-1">
                    <label class="text-[#111418] dark:text-white text-sm font-medium pb-2" for="city">Ville</label>
                    <input
                        class="form-input w-full rounded-lg text-[#111418] dark:text-white border border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark h-12 p-4"
                        id="city" placeholder="Paris" type="text" />
                </div>
            </div>

            <div class="flex flex-wrap items-end gap-4 pt-3">
                <div class="flex flex-col min-w-24 flex-1">
                    <label class="text-[#111418] dark:text-white text-sm font-medium pb-2" for="prix">Loyer (€)</label>
                    <input
                        class="form-input w-full rounded-lg text-[#111418] dark:text-white border border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark h-12 p-4"
                        id="prix" type="number" />
                </div>
                <div class="flex flex-col min-w-24 flex-1">
                    <label class="text-[#111418] dark:text-white text-sm font-medium pb-2" for="superficie">Surface
                        (m²)</label>
                    <input
                        class="form-input w-full rounded-lg text-[#111418] dark:text-white border border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark h-12 p-4"
                        id="superficie" type="number" />
                </div>
                <div class="flex flex-col min-w-24 flex-1">
                    <label class="text-[#111418] dark:text-white text-sm font-medium pb-2" for="pieces">Pièces</label>
                    <input
                        class="form-input w-full rounded-lg text-[#111418] dark:text-white border border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark h-12 p-4"
                        id="pieces" type="number" />
                </div>
            </div>

            <div class="pt-4">
                <p id="add-error" class="text-red-500 text-sm mb-2 hidden"></p>
                <p id="add-success" class="text-green-500 text-sm mb-2 hidden"></p>
                <button id="add-property-btn"
                    class="w-full h-12 bg-primary text-white font-bold rounded-xl shadow-md">Enregistrer la
                    propriété</button>
            </div>
        </div>
        <hr class="border-gray-100 dark:border-gray-800 my-4">
    </div>

    <!-- Liste des Biens -->
    <div class="p-4">
        <div class="flex items-center justify-between pb-4">
            <h2 class="text-[#111418] dark:text-white text-xl font-bold leading-tight">Biens Enregistrés</h2>
            <span class="text-xs text-gray-500 font-medium" id="prop-count">0 bien(s)</span>
        </div>
        <div id="properties-list" class="flex flex-col gap-3">
            <p class="text-sm text-gray-500 italic">Chargement des biens...</p>
        </div>
    </div>
</main>
{% endblock %}
