{% extends 'base.html' %}

{% block content %}
<div class="flex-1 pb-28">
    <!-- Top App Bar -->
    <div
        class="flex flex-col gap-2 bg-white dark:bg-background-dark p-4 pb-2 sticky top-0 z-10 border-b border-gray-200 dark:border-gray-800">
        <div class="flex h-12 items-center justify-between">
            <div class="flex size-12 shrink-0 items-center">
                <div class="aspect-square size-10 rounded-full bg-cover bg-center bg-no-repeat"
                    data-alt="Profile picture of property owner"
                    style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAPwwqRtuEvRKnyn2dgclR4LqnRaRpPaxAAIaOdEFvo-i72AupHxdFWSpzPj7z96-SOXN5lhozlfvalfgSd5sOyuqF5oq6Jm0_Zy8Mf7HM9CB95bqXVFS3LIJZYluZhtLfGX9ZG0I_JScTj-3an7Ouah7MqcDmgesmfrDqxl7ArModSJWjRpHLgl33Fj-KZxuCYt5zfWwCmWSsPhMK7uSW8ckL6UbTeay9WuxvBdytYgxp3-4i2fl9HqewHwgSPwcByZT26LV4xpsY");'>
                </div>
            </div>
            <div class="flex items-center justify-end">
                <a href="/ajouter-propriete"
                    class="flex items-center gap-1 rounded-lg bg-primary/10 dark:bg-primary/20 px-3 py-2 text-primary dark:text-white text-sm font-bold">
                    <span class="material-symbols-outlined text-base">add</span>
                    Ajouter
                </a>
            </div>
        </div>
        <p class="text-2xl font-bold leading-tight tracking-tight text-[#111418] dark:text-gray-100" id="owner-name">
            Bonjour !</p>
    </div>
    <!-- Stats -->
    <div class="grid grid-cols-2 gap-3 p-4">
        <div
            class="flex flex-col gap-1 rounded-xl bg-white dark:bg-gray-800 p-4 border border-gray-200 dark:border-gray-700">
            <p class="text-xs font-medium leading-normal text-[#617589] dark:text-gray-400 uppercase">A percevoir</p>
            <p class="text-xl font-bold leading-tight tracking-tight text-primary dark:text-primary" id="owner-income">
                €0</p>
        </div>
        <div
            class="flex flex-col gap-1 rounded-xl bg-white dark:bg-gray-800 p-4 border border-gray-200 dark:border-gray-700">
            <p class="text-xs font-medium leading-normal text-[#617589] dark:text-gray-400 uppercase">Encaissés</p>
            <p class="text-xl font-bold leading-tight tracking-tight text-green-600 dark:text-green-400"
                id="owner-collected">
                €0</p>
        </div>
        <div
            class="flex flex-col gap-1 rounded-xl bg-white dark:bg-gray-800 p-4 border border-gray-200 dark:border-gray-700">
            <p class="text-xs font-medium leading-normal text-[#617589] dark:text-gray-400 uppercase">Occupation</p>
            <p class="text-xl font-bold leading-tight tracking-tight text-[#111418] dark:text-gray-100"
                id="owner-occupied">0</p>
        </div>
        <div
            class="flex flex-col gap-1 rounded-xl bg-white dark:bg-gray-800 p-4 border border-gray-200 dark:border-gray-700">
            <p class="text-xs font-medium leading-normal text-[#617589] dark:text-gray-400 uppercase">Alertes</p>
            <p class="text-xl font-bold leading-tight tracking-tight text-red-500" id="owner-alerts">0</p>
        </div>
    </div>
    <!-- Upcoming Rents Section -->
    <div class="px-4">
        <h2 class="text-[22px] font-bold leading-tight tracking-[-0.015em] text-[#111418] dark:text-gray-100 pt-3 pb-3">
            Prochains loyers à percevoir</h2>
        <div class="flex flex-col gap-2" id="owner-upcoming-rents">
            <p class="text-sm text-gray-500 italic p-4 text-center">Chargement des loyers...</p>
        </div>
    </div>
    <!-- Important Alerts Section -->
    <div class="px-4 pb-4">
        <h2 class="text-[22px] font-bold leading-tight tracking-[-0.015em] text-[#111418] dark:text-gray-100 pt-6 pb-3">
            Alertes importantes</h2>
        <div class="flex flex-col gap-2" id="owner-alerts-list">
            <p class="text-sm text-gray-500 italic p-4 text-center">Recherche d'alertes...</p>
        </div>
    </div>
</div>
{% endblock %}
